gid: type._inputs.*.hidden
url: /configuration-file/types/_inputs/*/hidden/
title: ''
description: >-
  This key defines the visibility of an input in the *Data Editor* or the
  sidebar of the *Visual Editor* or *Content Editor*.


  Hidden inputs are useful when you want an input to exist, but not be visible
  or editable outside of the Source Editor.


  Value can be a boolean or a string. A boolean value of `true` will hide the
  input.


  A string value is an expression. CloudCannon re-evaluates the expression
  whenever a value it reads changes, and hides the input whenever the result is
  truthy.


  * `!published` hides an input when the sibling input `published` is falsy

  * `type != "video"` hides an input unless the sibling input `type` holds
  `video`

  * `$.draft` hides an input when the top-level `draft` value is truthy


  Expressions can compare values, call functions such as `length` and
  `starts_with`, and read values elsewhere in the file with `$`, `$parent`, and
  `this`.


  For an expression beginning with a character `YAML` reserves, such as `!`, the
  string should be in `'` or `"` quotation marks.


  By default, this key follows the input naming convention where key names
  beginning with an underscore are hidden `true`.
examples: []
