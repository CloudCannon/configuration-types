gid: type._inputs.*.disabled
url: /configuration-file/types/_inputs/*/disabled/
title: ''
description: >-
  This key defines whether the value of an input is editable in the *Data
  Editor* or the sidebar of the *Visual Editor* or *Content Editor*.


  Disabled inputs are useful if you want CloudCannon to display the input value,
  but prevent team members from editing the value outside of the Source

  Editor.


  The value of this key can be a boolean or a string. A boolean value of `true`
  will prevent team members from editing the value.


  A string value is an expression. CloudCannon re-evaluates the expression
  whenever a value it reads changes, and makes the input read-only whenever the
  result is truthy.


  * `published` disables an input when the sibling input `published` is truthy

  * `!published` disables an input when the sibling input `published` is falsy

  * `length(slug) > 0` disables an input once the sibling input `slug` holds a
  value


  Expressions can compare values, call functions such as `length` and
  `starts_with`, and read values elsewhere in the file with `$`, `$parent`, and
  `this`.


  For an expression beginning with a character `YAML` reserves, such as `!`, the
  string should be in `'` or `"` quotation marks.


  By default, this key is `false` (i.e., team members can edit input values).
examples:
  - description: >-
      In this example, we have configured the `date_created` Date input, which
      will automatically populate when you create a file using this input. Team
      members cannot alter this input as the interface is disabled.
    language: yaml
    code: |-
      _inputs:
        date_created:
          type: datetime
          label: Date of article creation
          comment: UTC +0 timezone
          disabled: true
          instance_value: NOW
          options:
            timezone: Etc/UTC
    annotations: []
    source: /cloudcannon.config.yml
show_in_navigation: false
