gid: type._editables.*.align.justify
url: /configuration-file/types/_editables/*/align/justify/
title: ''
description: >-
  This key toggles whether CloudCannon will display a tool in your WYSIWYG
  toolbar to justify selected text. This will toggle `style="text-align:
  justify;"`, or toggle a class name set in `classes.justify` for that text
  block.
