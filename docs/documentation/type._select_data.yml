gid: type._select_data
url: /configuration-file/types/_select_data/
title: ''
description: >-
  This key defines defines fixed data sets to populate Select and Multiselect
  inputs at a given level of the configuration cascade.


  This key has no default.


  If undefined at higher levels of the [configuration
  cascade](/documentation/articles/using-the-configuration-cascade/),
  `_select_data` will default to

  any values configured in the [CloudCannon configuration
  file](/documentation/articles/what-is-the-cloudcannon-configuration-file/).


  For more information about fixed data sets, please read our documentation on
  [populating a Select input](/documentation/developer-articles/populate-a-select-input/).
examples:
  - description: In this example, we have configured the `blog_tags` Multiselect
      input for the `blog` Collection.
    language: yaml
    code: |-
      collections_config:
        blog:
          _select_data:
            blog_topics:
              - Opinion
              - Feature
              - Resource
    annotations: []
    source: /cloudcannon.config.yml
show_in_navigation: true
